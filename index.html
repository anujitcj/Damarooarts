<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#FF5A00" />
<title>Damaroo Arts</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23FF5A00'/%3E%3Ccircle cx='16' cy='16' r='7' fill='white'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="site.css" />
</head>
<body data-tab="home">
<div id="auth-gate" class="auth-gate">
  <div class="auth-box">
    <span class="proj-kicker">DAMAROO ARTS · PRIVATE</span>
    <h1 id="auth-title">Checking access.</h1>
    <p id="auth-message">Verifying your authorised Google account...</p>
    <div id="auth-detail" class="auth-detail" hidden></div>
    <button id="auth-retry" type="button" hidden>Retry</button>
  </div>
</div>

<header class="site-header">
  <a class="mark" href="#home" data-tab="home" aria-label="Damaroo Arts, home"><span class="mark-dot"></span>DAMAROO ARTS</a>
  <nav class="tabs" role="tablist" aria-label="Sections">
    <span class="tab-ink" aria-hidden="true"></span>
    <button class="tab" role="tab" id="tab-home" data-tab="home" aria-selected="true" aria-controls="view-home">Home</button>
    <button class="tab" role="tab" id="tab-tool" data-tab="tool" aria-selected="false" aria-controls="view-tool" tabindex="-1">Storyboard<span class="tab-long">&nbsp;Simulator</span></button>
    <button class="tab" role="tab" id="tab-projects" data-tab="projects" aria-selected="false" aria-controls="view-projects" tabindex="-1">Projects</button>
  </nav>
  <div class="user-chip" id="user-chip" hidden>
    <span id="user-name"></span>
    <span id="user-role"></span>
  </div>
</header>

<main id="app" class="stage-wrap">
  <section class="view active" id="view-home" role="tabpanel" aria-labelledby="tab-home">
    <div class="hero" id="hero">
      <div class="beam"></div><canvas id="dust"></canvas><div class="glow"></div><div class="vignette"></div><div class="grain"></div>
      <div class="bar bar-top"></div><div class="bar bar-bot"></div><div class="frame"><i></i><i></i><i></i><i></i></div>
      <div class="center">
        <h1 class="title"><span class="sr">Damaroo Arts</span><span class="line l1" data-t="DAMAROO" aria-hidden="true"></span><span class="line l2" data-t="ARTS" aria-hidden="true"></span></h1>
        <p class="soon"><span class="rule"></span><span class="soon-text">Coming soon</span><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span><span class="rule"></span></p>
      </div>
      <div class="tc" aria-hidden="true"><span class="rec"></span><span id="tc">00:00:00:00</span></div>
    </div>
  </section>

  <section class="view" id="view-tool" role="tabpanel" aria-labelledby="tab-tool">
    <div class="tool-load" id="tool-load"><span></span></div>
    <iframe id="sb-frame" src="about:blank" title="Storyboard Simulator"></iframe>
  </section>

  <section class="view project-shell" id="view-projects" role="tabpanel" aria-labelledby="tab-projects">
    <div class="embedded-app" id="projects-load"><span></span></div>
    <iframe id="projects-frame" src="about:blank" title="Projects"></iframe>
  </section>
</main>

<div class="comment-modal" id="comment-modal" hidden>
  <div class="comment-backdrop" data-close-comment></div>
  <section class="comment-dialog" role="dialog" aria-modal="true" aria-labelledby="comment-title">
    <div class="comment-dialog-head"><div><span class="panel-kicker">SCREENPLAY · COMMENT</span><h3 id="comment-title">Add production note</h3></div><button type="button" class="modal-close" data-close-comment aria-label="Close">×</button></div>
    <div class="comment-context" id="comment-context"></div>
    <textarea id="comment-body" rows="6" maxlength="2000" placeholder="Write the production note..."></textarea>
    <div class="comment-dialog-foot"><span id="comment-anchor-label">Page —</span><div><button class="btn-secondary" type="button" data-close-comment>Cancel</button><button class="btn-primary" id="save-comment" type="button">Add Comment</button></div></div>
  </section>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script src="pdf/pdf.js?v=20260929.5"></script>
<script src="site.js?v=20260929.5"></script>
</body>
</html>
