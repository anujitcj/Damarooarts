<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Damaroo Arts</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: monospace, system-ui; background: #F6F4EF; color: #1A1A1A; }

  .site-header {
    background: #1A1A1A;
    padding: 0 28px;
    display: flex;
    align-items: center;
    gap: 40px;
    height: 48px;
  }

  .site-title {
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.2em;
    color: #F6F4EF;
    flex-shrink: 0;
  }

  .site-nav { display: flex; gap: 4px; }

  .nav-tab {
    font-family: monospace;
    font-size: 11px;
    letter-spacing: 0.06em;
    padding: 6px 16px;
    border-radius: 3px;
    border: 1px solid transparent;
    background: transparent;
    color: #9CA3AF;
    cursor: pointer;
    transition: color .15s, background .15s, border-color .15s;
  }
  .nav-tab:hover { color: #F6F4EF; }
  .nav-tab.active { color: #F6F4EF; background: #374151; border-color: #4B5563; }

  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .home-page {
    display: flex;
    align-items: center;
    justify-content: center;
    height: calc(100vh - 48px);
    color: #8A8580;
    font-family: monospace;
    font-size: 13px;
    letter-spacing: 0.06em;
  }

  #tab-storyboard { height: calc(100vh - 48px); }

  iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }
</style>
</head>
<body>

<header class="site-header">
  <div class="site-title">DAMAROO ARTS</div>
  <nav class="site-nav">
    <button class="nav-tab active" data-tab="home">Home</button>
    <button class="nav-tab" data-tab="storyboard">Storyboard Simulator</button>
  </nav>
</header>

<div id="tab-home" class="tab-content active">
  <div class="home-page">— coming soon —</div>
</div>

<div id="tab-storyboard" class="tab-content">
  <iframe id="sb-frame" src="" title="Storyboard Simulator"></iframe>
</div>

<script>
  const tabs = document.querySelectorAll(".nav-tab");
  const contents = document.querySelectorAll(".tab-content");
  let sbLoaded = false;

  tabs.forEach(tab => {
    tab.addEventListener("click", () => {
      tabs.forEach(t => t.classList.remove("active"));
      contents.forEach(c => c.classList.remove("active"));
      tab.classList.add("active");
      document.getElementById("tab-" + tab.dataset.tab).classList.add("active");

      if (tab.dataset.tab === "storyboard" && !sbLoaded){
        document.getElementById("sb-frame").src = "storyboard.html";
        sbLoaded = true;
      }
    });
  });
</script>

</body>
</html>
