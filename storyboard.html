<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Damaroo — Storyboard Simulator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="landing" class="landing">
    <div class="landing-card">
      <div class="landing-title">STORYBOARD SIMULATOR</div>
      <div class="stage-grid">
        <button class="stage-card" data-stage="camera">CAMERA PATH</button>
        <button class="stage-card" data-stage="object">OBJECT</button>
        <button class="stage-card" data-stage="shot">SHOT</button>
      </div>
    </div>
  </div>

  <header class="topbar">
    <div class="brand">DAMAROO <em>STORYBOARD SIMULATOR</em></div>
    <nav class="steps">
      <button class="step-tab" data-stage="camera">01 Camera Path</button>
      <button class="step-tab" data-stage="object">02 Object</button>
      <button class="step-tab" data-stage="shot">03 Shot</button>
    </nav>
    <div class="scene-name" id="scene-name" contenteditable="true" spellcheck="false">SCENE 001</div>
    <div class="top-actions">
      <button id="undo">Undo</button><button id="redo">Redo</button>
      <button id="new-scene">New</button><button id="save-scene">Save</button>
      <button id="load-scene">Load</button><input id="load-input" type="file" accept=".json" hidden>
    </div>
  </header>

  <main class="workspace">
    <aside class="left-panel">
      <section id="camera-panel" class="mode-panel"></section>
      <section id="object-panel" class="mode-panel" hidden></section>
      <section id="shot-panel" class="mode-panel" hidden></section>
    </aside>

    <section class="viewport">
      <div id="viewport3d"></div>
      <div class="viewport-hud">
        <div id="mode-title">CAMERA PATH</div>
        <div id="camera-readout">X 0.00 · Y 1.60 · Z 7.00 · P 0° · Y 180° · R 0°</div>
      </div>
      <div id="toast"></div>
      <div class="crosshair"></div>
    </section>

    <aside class="right-panel">
      <div class="panel-head">SCENE <span id="scene-count">0</span></div>
      <div id="entity-list" class="entity-list"></div>
    </aside>
  </main>

  <footer class="bottom">
    <div class="transport">
      <button id="play">▶ PLAY</button><button id="pause">Ⅱ PAUSE</button><button id="restart">↺ RESTART</button>
      <button id="prev-frame">‹ FRAME</button><button id="next-frame">FRAME ›</button>
    </div>
    <div class="frame-readout" id="frame-readout">FRAME 0 / 0 · 12 FPS</div>
    <input id="timeline" type="range" min="0" max="0" value="0" step="1">
  </footer>

  <script>
    // Entry navigation intentionally works before the 3D engine initializes.
    document.querySelectorAll('.stage-card').forEach(function(button) {
      button.addEventListener('click', function() {
        document.getElementById('landing').classList.add('hidden');
        document.querySelectorAll('.step-tab').forEach(function(tab) {
          tab.classList.toggle('active', tab.dataset.stage === button.dataset.stage);
        });
        document.querySelectorAll('.mode-panel').forEach(function(panel) {
          panel.hidden = true;
        });
        var panel = document.getElementById(button.dataset.stage + '-panel');
        if (panel) panel.hidden = false;
        var title = document.getElementById('mode-title');
        if (title) title.textContent =
          button.dataset.stage === 'camera' ? 'CAMERA PATH' :
          button.dataset.stage === 'object' ? 'OBJECT' : 'SHOT';
        window.__damarooRequestedStage = button.dataset.stage;
      });
    });
  </script>
  <script type="module" src="app.js"></script>
</body>
</html>
