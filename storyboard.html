<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Damaroo — Storyboard Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="topbar">
  <div class="topbar-left"><span class="brand">DAMAROO</span><span class="brand-sub">Storyboard Simulator</span></div>
  <nav class="steps">
    <button class="step-tab active" data-step="0">1 &nbsp;Camera</button>
    <button class="step-tab" data-step="1">2 &nbsp;Objects</button>
  </nav>
  <div class="topbar-center" id="shot-label" contenteditable="true" spellcheck="false" title="Click to rename this shot">SHOT 001</div>
  <div class="topbar-right">
    <button class="btn-ghost" id="btn-toggle-grid" title="Rule-of-thirds grid">Grid</button>
    <button class="btn-ghost" id="btn-export-png" title="Export current frame">Export PNG</button>
    <button class="btn-ghost" id="btn-export-sheet" title="Export all shots">Export Sheet</button>
  </div>
</header>

<div class="app-body">
  <aside class="panel-left">
    <section class="ctrl-section" id="pan-cam"></section>
    <section class="ctrl-section" id="pan-obj" hidden></section>
  </aside>

  <main class="panel-center">
    <div class="canvas-wrap"><canvas id="storyboard-canvas" width="960" height="540"></canvas></div>
    <div class="shot-actions">
      <span class="shot-info" id="shot-info"></span>
      <button class="btn-secondary" id="btn-next">Lock camera, place objects</button>
      <button class="btn-primary" id="btn-save-shot">Save Shot</button>
      <button class="btn-secondary" id="btn-new-shot">+ New Shot</button>
      <button class="btn-secondary" id="btn-duplicate-shot">Duplicate</button>
    </div>
    <div class="timeline-wrap">
      <div class="timeline-label">Timeline</div>
      <div class="timeline-strip" id="timeline-strip"></div>
    </div>
  </main>

  <aside class="panel-right" id="panel-right" hidden>
    <div class="ctrl-section-title" style="padding:16px 16px 0;">Scene Objects <span class="count" id="obj-count">0/3</span></div>
    <div class="ctrl-hint" style="padding:0 16px 10px;">First object is the background. Each new one is layered in front of the previous.</div>
    <div class="obj-list" id="obj-list"></div>
    <div class="add-obj-wrap">
      <button class="btn-add-obj" id="btn-add-obj">+ Add Object</button>
      <div class="obj-picker" id="obj-picker" hidden></div>
    </div>
  </aside>
</div>
<script src="app.js" type="module"></script>
</body>
</html>
